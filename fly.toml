app = "backstage-live"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  FALKORDB_HOST = "backstage-falkor.internal"
  FALKORDB_PORT = "6379"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
